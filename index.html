<title>שליחון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap">
<style>
/* Layout: phone-first single column. One decision per screen; primary actions sit in the thumb zone at the bottom. Cards read like shipping slips. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#E6EAF3; --ink:#121A2F; --muted:#4A556E; --line:#D3D9E6;
  --accent:#C2410C; --on-accent:#FFFFFF; --accent-bright:#FF6B1A; --accent-soft:#FFE8D9;
  --blue:#2F55D4; --blue-soft:#E1E8FF;
  --yes:#15803D; --on-yes:#FFFFFF; --yes-soft:#DDF4E5;
  --no:#B91C1C; --no-soft:#FCE3E3;
  --yes-ink:#166534; --accent-ink:#9A3412; --star:#A86F00; --warn:#B45309;
  --shadow:0 1px 2px rgba(18,26,47,.06),0 10px 30px rgba(18,26,47,.10);
  --f-display:"Fredoka","Rubik","Arial Hebrew","Segoe UI",sans-serif;
  --f-body:"Rubik","Segoe UI","Arial Hebrew",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1122; --surface:#161D33; --sunk:#1E2741; --ink:#EEF1F8; --muted:#A7B1C8; --line:#2C3755;
  --accent:#FF8A4C; --on-accent:#1A0B02; --accent-bright:#FF8A4C; --accent-soft:#3A2416;
  --blue:#8AA6FF; --blue-soft:#1D2A55;
  --yes:#3DD68C; --on-yes:#04210F; --yes-soft:#11301F;
  --no:#FF7B7B; --no-soft:#3A1A20; --yes-ink:#3DD68C; --accent-ink:#FF9A62; --star:#F5B83D; --warn:#F5A524;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1122; --surface:#161D33; --sunk:#1E2741; --ink:#EEF1F8; --muted:#A7B1C8; --line:#2C3755;
  --accent:#FF8A4C; --on-accent:#1A0B02; --accent-bright:#FF8A4C; --accent-soft:#3A2416;
  --blue:#8AA6FF; --blue-soft:#1D2A55;
  --yes:#3DD68C; --on-yes:#04210F; --yes-soft:#11301F;
  --no:#FF7B7B; --no-soft:#3A1A20; --yes-ink:#3DD68C; --accent-ink:#FF9A62; --star:#F5B83D; --warn:#F5A524;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark }

html{font-size:17px}
html[lang="ru"]{--f-display:"Rubik","Segoe UI",Arial,sans-serif}
html[lang="ar"]{--f-display:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;--f-body:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
html[dir="ltr"] .dirsvg{transform:scaleX(-1)}
.langbtn{width:auto;min-width:42px;height:42px;border-radius:99px;padding:0 10px;gap:4px;display:inline-flex;align-items:center;font-weight:700;font-size:.82rem}
.langbtn svg{width:18px;height:18px}
.langmenu{position:fixed;z-index:46;background:var(--surface);border-radius:16px;box-shadow:var(--shadow),0 0 0 1px var(--line) inset;padding:6px;min-width:180px;display:flex;flex-direction:column;animation:pop .15s ease}
.langmenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;padding:12px 14px;border-radius:12px;font-weight:600;min-height:48px;font-family:"Rubik","Cairo",sans-serif}
.langmenu button:hover,.langmenu button:focus-visible{background:var(--sunk)}
.langmenu button[aria-checked="true"]{color:var(--accent-ink)}
html.big{font-size:20px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.55rem;line-height:1;display:flex;align-items:center;gap:8px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--accent-bright);display:grid;place-items:center;color:#fff;transform:rotate(-6deg)}
.mark svg{width:20px;height:20px}
@media (max-width:440px){.role-tag{display:none!important}}
.role-tag{white-space:nowrap;font-size:.8rem;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
#testbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.testbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px;padding:8px 12px;border-radius:14px;border:2px dashed var(--accent-bright);background:var(--accent-soft);font-size:.82rem;font-weight:600}
#view{flex:1;min-height:0;overflow-y:auto;padding-block:6px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);position:relative;min-height:64px}
nav.tabs .ic{width:56px;height:32px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
nav.tabs svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .ic{background:var(--accent-soft);color:var(--accent-ink)}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:.72rem;font-weight:700;line-height:20px;font-variant-numeric:tabular-nums;border:2px solid var(--surface);box-sizing:content-box}

h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.75rem}
h2{font-size:1.3rem}
h3{font-size:1.1rem}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:.8rem;font-weight:600;letter-spacing:.3px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:600;font-size:1rem;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.small{padding:7px 14px;min-height:42px;font-size:.9rem;border-radius:12px}
.btn.block{width:100%}
.btn.grow{flex:1}
.btn svg{width:20px;height:20px;flex:none}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:40px}
.iconbtn{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px var(--line) inset}
.iconbtn svg{width:22px;height:22px}
.themebtn{width:42px;height:42px}
.chat{position:relative}
.infobtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.85rem;font-weight:600;min-height:40px;flex:none}
.infobtn svg{width:16px;height:16px}
.infobtn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jobpanel{position:absolute;top:58px;left:0;right:0;z-index:6;background:var(--surface);border-radius:18px;box-shadow:var(--shadow),0 0 0 1px var(--line) inset;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:60%;overflow-y:auto;animation:pop .18s ease}

.notice{border-radius:14px;padding:12px 14px;background:var(--accent-soft);font-size:.92rem;margin-bottom:12px}
.notice.bad{background:var(--no-soft)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 8px}
.empty .art{width:96px;height:96px;border-radius:32px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;transform:rotate(-4deg);margin-bottom:8px}
.empty .art svg{width:48px;height:48px}
.empty p{color:var(--muted);margin:0;max-width:34ch}
.empty .btns{display:flex;flex-direction:column;gap:10px;margin-top:14px;width:100%;max-width:320px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:.9rem;font-weight:600}
.inp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:56px;font-size:1.05rem}
.inp:focus{border-color:var(--blue);outline:none}
.inp.huge{font-family:var(--f-display);font-size:1.6rem;font-weight:600;text-align:center}
textarea.inp{min-height:96px;resize:vertical}
.err-text{color:var(--no);font-weight:600;margin:0;min-height:1.4em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

/* tiles: big single-choice cards */
.tiles{display:grid;gap:10px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{position:relative;display:block}
.tile input{position:absolute;opacity:0;pointer-events:none}
.tile .tb{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:72px;transition:border-color .15s,background .15s,transform .1s}
.tiles.two .tile .tb{flex-direction:column;text-align:center;padding:18px 10px;gap:8px}
.tile .ti{width:46px;height:46px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;flex:none}
.tile .ti svg{width:28px;height:28px}
.tile .tt{min-width:0;flex:1}
.tile .tt b{display:block;font-size:1.05rem}
.tile .tt small{display:block;color:var(--muted);font-size:.85rem}
.tile .tk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.tiles.two .tile .tk{position:absolute;top:10px;inset-inline-start:10px}
.tile .tk svg{width:16px;height:16px}
.tile input:checked+.tb{border-color:var(--accent);background:var(--accent-soft)}
.tile input:checked+.tb .ti{background:var(--accent-bright);color:#fff}
.tile input:checked+.tb .tk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile input:focus-visible+.tb{outline:3px solid var(--blue);outline-offset:2px}
.tile .tb:active{transform:scale(.98)}
.rec{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--yes-soft);color:var(--yes-ink);margin-inline-start:6px;vertical-align:middle}

/* chips: multi or quick choice */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.qchip{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;min-height:46px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:500;cursor:pointer;user-select:none}
.chip input:checked+span,.qchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input:checked+span::before{content:"✓";font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}

/* wizard */
.wiz{display:flex;flex-direction:column;gap:14px;min-height:100%}
.wiz-top{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent-bright);border-radius:99px;transition:width .35s ease}
.stepnum{font-size:.85rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.wiz h1{outline:none}
.wiz-body{display:flex;flex-direction:column;gap:14px;animation:stepIn .28s ease}
@keyframes stepIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.wiz-foot{position:sticky;bottom:-24px;margin-top:auto;padding-block:18px 24px;background:linear-gradient(to top,var(--bg) 72%,transparent);display:flex;gap:10px}
.rolecards{display:grid;gap:14px}
.rolecard{text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center;min-height:110px;transition:transform .1s,border-color .15s}
.rolecard:hover{border-color:var(--accent)}
.rolecard:active{transform:scale(.98)}
.rolecard .ti{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;flex:none}
.rolecard .ti svg{width:36px;height:36px}
.rolecard b{font-family:var(--f-display);font-weight:600;font-size:1.3rem;display:block}
.rolecard small{color:var(--muted);font-size:.92rem}
.hero{padding:10px 0 4px}
.hero h1{font-size:2rem}

/* deck */
.deck-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.deck-head>div{min-width:0;flex:1}
.filter{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.82rem;font-weight:600;min-height:40px;max-width:52%}
.filter span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter svg{width:16px;height:16px;flex:none}
.deck{position:relative;height:clamp(390px,calc(100vh - 360px),540px);height:clamp(390px,calc(100dvh - 360px),540px)}
.card{position:absolute;inset:0;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y;user-select:none;transition:transform .3s cubic-bezier(.2,.8,.3,1)}
.card.top{cursor:grab;z-index:3}
.card.u1{transform:scale(.95) translateY(14px);z-index:2;pointer-events:none}
.card.u2{transform:scale(.9) translateY(28px);z-index:1;pointer-events:none;opacity:.6}
.card.preview{position:relative;inset:auto;cursor:default}
.slip{position:relative;padding:18px 20px 16px;background:var(--accent-soft);display:flex;align-items:flex-start;gap:12px;border-bottom:2px dashed var(--line)}
.slip.blue{background:var(--blue-soft)}
.slip::before,.slip::after{content:"";position:absolute;bottom:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.slip::before{left:-10px}.slip::after{right:-10px}
.slip>div{min-width:0}
.price{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-family:var(--f-body);font-size:1rem;font-weight:600;color:var(--muted)}
.barcode{margin-inline-start:auto;width:64px;height:30px;flex:none;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px);opacity:.28;border-radius:2px}
.slip-body{flex:1;min-height:0;padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px}
.ribbon{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--yes-soft);color:var(--yes-ink);font-weight:600;font-size:.88rem}
.ribbon svg{width:18px;height:18px;flex:none}
.route{display:grid;grid-template-columns:22px 1fr;column-gap:12px}
.route .dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);margin-top:6px;justify-self:center;background:var(--surface)}
.route .dot.end{background:var(--accent-bright);border-color:var(--accent-bright)}
.route .line{width:3px;justify-self:center;background:repeating-linear-gradient(var(--muted) 0 5px,transparent 5px 10px);min-height:18px;border-radius:2px}
.route .pt{min-width:0}
.route .pt small{font-size:.8rem;color:var(--muted);font-weight:500}
.route .pt b{display:block;font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--sunk)}
.tag svg{width:15px;height:15px}
.tag.hot{background:var(--accent);color:var(--on-accent)}
.notes{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.who{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.who>div{min-width:0}
.who b{display:block}
.who small{font-size:.85rem;color:var(--muted)}
.ava{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:1.1rem;font-family:var(--f-display)}
.ava.big{width:76px;height:76px;font-size:2rem}
.stamp{position:absolute;top:26px;padding:4px 14px;border:4px solid;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:1.7rem;opacity:0;pointer-events:none;z-index:4;background:var(--surface)}
.stamp.yes{left:20px;color:var(--yes-ink);border-color:var(--yes);transform:rotate(-12deg)}
.stamp.no{right:20px;color:var(--no);border-color:var(--no);transform:rotate(12deg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.deck-actions{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:20px;direction:ltr}
html[dir="rtl"] .deck-actions .act{direction:rtl}
.act{border:0;border-radius:99px;min-height:62px;padding:0 26px;display:inline-flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:700;box-shadow:var(--shadow);flex:1;max-width:190px;justify-content:center;transition:transform .1s}
.act:active{transform:scale(.95)}
.act svg{width:24px;height:24px}
.act.no{background:var(--surface);color:var(--no);border:2px solid var(--no-soft)}
.act.yes{background:var(--yes);color:var(--on-yes)}
.undo{width:50px;height:50px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;flex:none}
.undo svg{width:22px;height:22px}
.hint{text-align:center;font-size:.85rem;color:var(--muted);margin:12px 0 0}

/* sender */
.jobpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.jobpick button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px;text-align:start;font-size:.82rem;max-width:230px;min-height:52px}
.jobpick button b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:12px}
.jobcard{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 1px var(--line) inset}
.pill{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px}
.pill.open{background:var(--yes-soft);color:var(--yes-ink)}
.pill.closed{background:var(--sunk);color:var(--muted)}
.next{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--sunk);font-weight:600;font-size:.92rem}
.next span{flex:1;min-width:140px}
.next.good{background:var(--yes-soft)}
.next.hot{background:var(--accent-soft)}

/* chats */
.chatrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:0;border-radius:20px;padding:12px 14px;box-shadow:0 0 0 1px var(--line) inset;min-height:76px}
.chatrow>div:not(.ava){min-width:0;flex:1}
.chatrow b{display:block}
.chatrow .meta{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

const Q={};
function queue(k,fn){Q[k]=(Q[k]||Promise.resolve()).then(fn).catch(async e=>{
  if(e&&e.code==="invalid_argument"&&SIZE_COLS.includes(k)&&!S.readOnly){try{if(await compactDoc(k,true)){await fn();return}}catch(e2){e=e2}}
  writeErr(e)});return Q[k]}
/* keep each person's documents well under the 256 KiB store limit */
const SIZE_COLS=["chats","jobs","swipes","ratings"],SIZE_SOFT=170000;
const docSize=o=>{try{return JSON.stringify(o||{}).length}catch(_){return 0}};
function compacted(col,d,hard){
  d=clone(d||{});const now=Date.now(),DAY=864e5;
  if(col==="chats"){const ms=new Map(myMatches().map(m=>[m.id,m]));const th=d.threads||{};
    const old=mid=>{const m=ms.get(mid);if(!m)return true;const c=curStatus(m);return isClosed(m)||(c&&c.s==="done"&&now-c.t>3*DAY)};
    for(const mid of Object.keys(th)){if(!ms.has(mid)&&(d.meta||{})[mid]&&(d.meta[mid].d)){delete th[mid];continue}if(old(mid))th[mid]=th[mid].slice(-(hard?6:15))}
    if(docSize(d)>SIZE_SOFT)for(const mid of Object.keys(th))th[mid]=th[mid].slice(-40);
    if(docSize(d)>SIZE_SOFT){const ids=Object.keys(th).sort((a,b)=>((th[a].slice(-1)[0]||{}).t||0)-((th[b].slice(-1)[0]||{}).t||0));while(docSize(d)>SIZE_SOFT&&ids.length){const id=ids.shift();if(!old(id))continue;delete th[id];if(d.status)delete d.status[id];if(d.eta)delete d.eta[id]}}
    for(const k of ["eta","dcode","dok"])if(d[k])for(const mid of Object.keys(d[k]))if(!ms.has(mid))delete d[k][mid];
  }
  if(col==="jobs"){const it=d.items||{};
    for(const [id,j] of Object.entries(it)){if(j&&j.status==="closed"&&now-(j.created||0)>(hard?7:30)*DAY){it[id]={country:j.country,cur:j.cur,fromRegion:j.fromRegion,from:"",toRegion:j.toRegion,to:"",size:j.size,vehicle:j.vehicle,price:j.price,status:"closed",archived:j.archived||undefined,created:j.created,slim:1}}}
    if(docSize(d)>SIZE_SOFT){const ids=Object.keys(it).filter(id=>it[id].status==="closed").sort((a,b)=>(it[a].created||0)-(it[b].created||0));while(docSize(d)>SIZE_SOFT&&ids.length)delete it[ids.shift()]}
  }
  if(col==="swipes"){const live=new Set(allJobs().filter(j=>j.status!=="closed").map(j=>j.id));for(const k of Object.keys(d.jobs||{}))if(!live.has(k))delete d.jobs[k];for(const k of Object.keys(d.couriers||{}))if(!live.has(k))delete d.couriers[k]}
  if(col==="ratings"){const g=d.given||{};const ids=Object.keys(g).sort((a,b)=>(g[a].t||0)-(g[b].t||0));while(docSize(d)>SIZE_SOFT&&ids.length)delete g[ids.shift()]}

async function compactDoc(col,hard){
  const cur=S[col]&&S[col][S.me];if(!cur||S.readOnly||S.test&&!S.me)return false;
  const n=compacted(col,cur,hard);if(docSize(n)>=docSize(cur))return false;

function housekeep(){if(S.readOnly||!myProfile())return;const now=Date.now();if(S.hkT&&now-S.hkT<60000)return;

function writeErr(e){

function sendMsg(mid,text,extra){return queue("chats",()=>{
  const doc=S.chats[S.me]||{};const threads=clone(doc.threads||{});
  const arr=(Array.isArray(threads[mid])?threads[mid]:[]).concat({t:Date.now(),x:text,...(extra||{})}).slice(-120);threads[mid]=arr;
  let size=JSON.stringify(threads).length;
  if(size<=180000)return mergeMine("chats",{threads:{[mid]:arr}});
  while(size>150000){let best=null;for(const [k,v] of Object.entries(threads)){if(k!==mid&&v.length&&(!best||v[0].t<threads[best][0].t))best=k}
    if(!best){threads[mid]=threads[mid].slice(-40);break}
    threads[best].splice(0,20);if(!threads[best].length)delete threads[best];size=JSON.stringify(threads).length}
  return mineRef("chats").set({...doc,threads}).then(()=>{S.real.chats=true})})}

const enc=new TextEncoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function pbkdf(pw,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);return b64(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(salt),iterations:120000,hash:"SHA-256"},k,256))}
async function sha(x){return b64(await crypto.subtle.digest("SHA-256",enc.encode(x)))}
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return a};
const newCode=()=>String(100000+(new Uint32Array(rnd(4).buffer)[0]%900000));
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const userOk=u=>/^[A-Za-z0-9_.]{3,20}$/.test(u);
const passOk=p=>p.length>=8&&/[A-Za-z\u0590-\u05FF\u0400-\u04FF\u0600-\u06FF]/.test(p)&&/\d/.test(p);
const sessKey=()=>"sess:"+S.realMe+":"+(S.test?"t:"+S.test:"r");
function readSess(){try{return JSON.parse(sessionStorage.getItem(sessKey())||"null")||JSON.parse(localStorage.getItem(sessKey())||"null")}catch(_){return null}}
function writeSess(aid,remember){const v=JSON.stringify({aid,t:Date.now()});try{sessionStorage.removeItem(sessKey());localStorage.removeItem(sessKey());(remember?localStorage:sessionStorage).setItem(sessKey(),v)}catch(_){}}
function clearSess(){try{sessionStorage.removeItem(sessKey());localStorage.removeItem(sessKey())}catch(_){}}
function clearTestSessions(){try{[localStorage,sessionStorage].forEach(st=>Object.keys(st).filter(k=>k.startsWith("sess:"+S.realMe+":t:")).forEach(k=>st.removeItem(k)))}catch(_){}}
function accounts(){return Object.entries((S.auth||{}).accounts||{}).map(([id,a])=>({id,...a}))}
function resolveSession(reset){
  const prev=S.me;let acc=null;
  const se=readSess();
  if(se&&S.auth){const a=(S.auth.accounts||{})[se.aid];if(a&&a.verified&&!!a.test===!!S.test)acc={id:se.aid,...a}}
  S.acc=acc;S.me=acc?acc.persona:null;
  if(reset||prev!==S.me){S.evs=null;S.chat=null;S.wiz=null;S.tab=null;S.known=null;S.popup=null;S.popupShown=null;S.err=null;S.lastSwipe=null;S.lastHtml="";S.tour=null;
    S.real={};if(S.me)for(const c of ["profiles","jobs","swipes","chats"])if(S[c][S.me])S.real[c]=true;
    const te=document.getElementById("tourEl");if(te)te.remove()}
}
function saveAuth(doc){S.auth=doc;return queue("auth",()=>S.db.doc("data/users/"+S.realMe+"/auth").set(doc).then(()=>{S.authExists=true}))}
function findAcc(idf){const x=norm(idf);return accounts().find(a=>!!a.test===!!S.test&&(a.ul===x||a.el===x))}
function authErr(msg,focus){const e=$("#a-err");if(e){e.textContent=msg;e.hidden=false}buzz(30);if(focus){const f=document.getElementById(focus);if(f)f.focus()}}
async function authSubmit(f){
  if(S.authBusy)return;S.authBusy=true;try{return await authSubmitInner(f)}finally{S.authBusy=false}
}
async function authSubmitInner(f){
  const kind=f.dataset.auth;const btn=f.querySelector('button[type="submit"]');
  if(!(window.crypto&&crypto.subtle))return authErr(tr("הדפדפן הזה לא תומך בהצפנה הנדרשת. נסו דפדפן עדכני."));
  if(S.readOnly)return authErr(tr("אין לך הרשאה לשמור בדף הזה"));
  const v=id=>((document.getElementById(id)||{}).value||"").trim();
  try{if(btn)btn.disabled=true;
  if(kind==="login"){
    const lock=ls.get("lock_"+S.realMe,0);if(Date.now()<lock)return authErr(tr("יותר מדי ניסיונות. נסו שוב בעוד כמה שניות."));
    const idf=v("l-id"),pw=(document.getElementById("l-pass")||{}).value||"";
    if(!idf)return authErr(tr("נא לכתוב אימייל או שם משתמש"),"l-id");
    if(!pw)return authErr(tr("נא לכתוב סיסמה"),"l-pass");
    const a=findAcc(idf);const okp=a&&(await pbkdf(pw,a.salt))===a.hash;
    if(!okp){const n=(S.failN||0)+1;S.failN=n;if(n>=5){ls.set("lock_"+S.realMe,Date.now()+30000);S.failN=0}
      return authErr(a||accounts().length?tr("אימייל/שם משתמש או סיסמה שגויים"):tr("לא נמצא משתמש. אפשר להירשם בלשונית ההרשמה."),"l-pass")}
    S.failN=0;const rem=!!(document.getElementById("l-rem")||{}).checked;
    if(!a.verified){const doc=clone(S.auth);const c=newCode();doc.accounts[a.id].code=c;doc.accounts[a.id].codeT=Date.now();await saveAuth(doc);S.av={v:"verify",aid:a.id,rem,focus:"v-code"};S.lastHtml="";render(true);return}
    writeSess(a.id,rem);resolveSession(true);say(tr("התחברת בהצלחה"));render(true);return;
  }
  if(kind==="register"){
    const em=v("r-email"),un=v("r-user"),pw=(document.getElementById("r-pass")||{}).value||"",pw2=(document.getElementById("r-pass2")||{}).value||"";
    if(!emailOk(em))return authErr(tr("נא לכתוב כתובת אימייל תקינה"),"r-email");
    if(!userOk(un))return authErr(tr("שם משתמש: 3–20 תווים באנגלית, ספרות, נקודה או קו תחתון"),"r-user");
    if(!passOk(pw))return authErr(tr("סיסמה: לפחות 8 תווים, עם אות ומספר"),"r-pass");
    if(pw!==pw2)return authErr(tr("הסיסמאות לא תואמות"),"r-pass2");
    const ul=norm(un),el=norm(em),eh=await sha(el);
    if(!S.test&&accounts().some(a=>!a.test))return authErr(tr("לחשבון ה־Claude הזה כבר יש משתמש. התחברו אליו בלשונית ההתחברות."));
    if(accounts().some(a=>a.ul===ul)||Object.values(S.handles||{}).some(h=>h.u===ul))return authErr(tr("שם המשתמש כבר תפוס"),"r-user");
    if(accounts().some(a=>a.el===el)||Object.values(S.handles||{}).some(h=>h.eh===eh))return authErr(tr("האימייל כבר רשום. אפשר להתחבר."),"r-email");
    const aid=uid();const salt=b64(rnd(16));const hash=await pbkdf(pw,salt);const persona=S.test?"test_"+aid:S.realMe;
    const doc=clone(S.auth);doc.accounts=doc.accounts||{};
    doc.accounts[aid]={u:un,ul,e:em,el,salt,hash,verified:false,code:newCode(),codeT:Date.now(),persona,test:!!S.test,created:Date.now()};
    await saveAuth(doc);
    queue("handles",()=>S.db.doc("handles/"+persona).set({u:ul,eh}));
    S.av={v:"verify",aid,rem:!!(document.getElementById("r-rem")||{}).checked,focus:"v-code"};S.lastHtml="";render(true);return;
  }
  if(kind==="verify"){
    const a=(S.auth.accounts||{})[S.av.aid];if(!a)return authErr(tr("החשבון לא נמצא"));
    const c=v("v-code");if(!/^\d{6}$/.test(c))return authErr(tr("נא לכתוב את הקוד בן 6 הספרות"),"v-code");
    if(Date.now()-(a.codeT||0)>15*60000)return authErr(tr("פג תוקף הקוד. שלחו קוד חדש."),"v-code");
    if(c!==a.code)return authErr(tr("הקוד שגוי"),"v-code");
    const doc=clone(S.auth);doc.accounts[S.av.aid].verified=true;delete doc.accounts[S.av.aid].code;await saveAuth(doc);
    writeSess(S.av.aid,S.av.rem!==false);S.av={v:"login"};resolveSession(true);say(tr("האימייל אומת. ברוכים הבאים!"));render(true);return;
  }
  if(kind==="forgot"){
    const a=findAcc(v("f-id"));if(!a)return authErr(tr("לא מצאנו משתמש עם הפרטים האלה"),"f-id");
    const doc=clone(S.auth);const c=newCode();doc.accounts[a.id].rcode=c;doc.accounts[a.id].rcodeT=Date.now();await saveAuth(doc);
    S.av={v:"reset",aid:a.id,focus:"x-code"};S.lastHtml="";render(true);return;
  }
  if(kind==="reset"){
    const a=(S.auth.accounts||{})[S.av.aid];if(!a)return authErr(tr("החשבון לא נמצא"));
    const c=v("x-code"),pw=(document.getElementById("x-pass")||{}).value||"",pw2=(document.getElementById("x-pass2")||{}).value||"";
    if(c!==a.rcode||Date.now()-(a.rcodeT||0)>15*60000)return authErr(tr("הקוד שגוי"),"x-code");
    if(!passOk(pw))return authErr(tr("סיסמה: לפחות 8 תווים, עם אות ומספר"),"x-pass");
    if(pw!==pw2)return authErr(tr("הסיסמאות לא תואמות"),"x-pass2");
    const doc=clone(S.auth);const salt=b64(rnd(16));doc.accounts[S.av.aid].salt=salt;doc.accounts[S.av.aid].hash=await pbkdf(pw,salt);delete doc.accounts[S.av.aid].rcode;doc.accounts[S.av.aid].verified=true;
    await saveAuth(doc);S.av={v:"login",focus:"l-id"};S.lastHtml="";render(true);say(tr("הסיסמה עודכנה. אפשר להתחבר."));return;
  }}finally{if(btn&&btn.isConnected)btn.disabled=false}
}

async function changePassword(f){

/* ---------- boot ---------- */
(async()=>{
  if(!window.claude||!window.claude.use){S.fatal="offline";return render(true)}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  claude.use("downloads").then(d=>{S.dl=d}).catch(()=>{});
  claude.use("assets").then(a=>{S.assets=a;if(a){document.querySelectorAll("#plusMenu button:disabled").forEach(x=>x.disabled=false);const n=document.querySelector("#plusMenu .note");if(n)n.remove()}}).catch(()=>{});
  if(!db||!user){S.fatal="nodb";return render(true)}
  S.db=db;S.me=await user.id();
  if(!S.me){S.fatal="noid";return render(true)}
  S.realMe=S.me;S.me=null;S.owner=await user.isOwner();
  const me=await user.me();S.meName=me.name||"";
  db.doc("data/users/"+S.realMe+"/codes").onSnapshot(sn=>{S.codes=(sn.exists&&sn.data())||{};S.codesReady=true;ensureCodes();render()},()=>{S.codesReady=true});
  db.doc("data/users/"+S.realMe+"/auth").onSnapshot(sn=>{S.auth=(sn.exists&&sn.data())||{accounts:{}};S.authExists=sn.exists;S.authReady=true;resolveSession();changed();render()},e=>{S.authReady=true;S.auth={accounts:{}};render(true)});
  db.collection("verify").limit(1000).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});S.verify=o;render()});
  if(!S.owner)db.doc("kyc/"+S.realMe).onSnapshot(d=>{const v=d.exists?d.data():null;if(v){S.kyc={[S.realMe]:v};S.real.kyc=true}render()},()=>{});
  else db.collection("kyc").limit(1000).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});S.kyc=o;if(S.me&&o[S.me])S.real.kyc=true;render()},()=>{});
  db.collection("ratings").limit(1000).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});S.ratings=o;if(S.me&&o[S.me])S.real.ratings=true;scanEvents();render()});
  db.collection("handles").limit(1000).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});S.handles=o});
  applyTest(hashRole());
  window.addEventListener("hashchange",()=>{applyTest(hashRole());changed();render(true)});
  const cw=await user.can("data.write");if(cw===false)S.readOnly=true;
  for(const col of ["profiles","jobs","swipes","chats"]){
    db.collection(col).limit(1000).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});S[col]=o;if(o[S.me])S.real[col]=true;S.ready[col]=true;_amC=null;changedSoon();
    },e=>{if(e&&e.code==="revoked"){S.fatal="nodb";render(true)}});
  }
})();
function changedSoon(){if(S._chT)return;S._chT=setTimeout(()=>{S._chT=0;changed()},30)}
function changed(){
  if(!allReady())return;_amC=null;
  if(!S.pruned){S.pruned=true;try{const sw=S.swipes[S.me];if(sw&&JSON.stringify(sw).length>150000&&!S.readOnly){const live=new Set(allJobs().filter(j=>j.status!=="closed").map(j=>j.id));const n=clone(sw);
    for(const k of Object.keys(n.jobs||{}))if(!live.has(k))delete n.jobs[k];for(const k of Object.keys(n.couriers||{}))if(!live.has(k))delete n.couriers[k];setSwipesDoc(n)}}catch(_){}}
  const ids=new Set(myMatches().map(m=>m.id));
  if(S.known===null){S.known=ids}
  else{for(const id of ids)if(!S.known.has(id)){S.popup=id;addNotif({kind:"match",mid:id},true)}S.known=ids}
  scanEvents();ensureCodes();genRecurring();housekeep();
  render();
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.createElement("canvas");c.className="confetti";c.setAttribute("aria-hidden","true");document.body.appendChild(c);
  const dpr=Math.min(2,devicePixelRatio||1),W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,ctx=c.getContext("2d");
  const cols=["#FF6B1A","#2F55D4","#15803D","#F5B700","#E0457B"];
  const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.2,y:H*.42,vx:(Math.random()-.5)*W*.03,vy:-(Math.random()*.028+.008)*H,r:(4+Math.random()*5)*dpr,c:cols[Math.random()*5|0],a:Math.random()*6,s:(Math.random()-.5)*.4}));
  let t=0;(function f(){t++;ctx.clearRect(0,0,W,H);for(const p of ps){p.vy+=H*.0011;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}
    if(t<120)requestAnimationFrame(f);else c.remove()})();
}

function parseLoc(raw){
  const s=(raw||"").trim();if(s.length<3)return null;
  const num=(a,b)=>{const la=+a,ln=+b;return isFinite(la)&&isFinite(ln)&&Math.abs(la)<=90&&Math.abs(ln)<=180?{lat:+la.toFixed(6),lng:+ln.toFixed(6)}:null};
  let m=s.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);if(m)return num(m[1],m[2]);
  if(/^https?:\/\//i.test(s)){
    let u;try{u=new URL(s)}catch(_){return null}
    if(u.protocol!=="https:"&&u.protocol!=="http:")return null;
    if(!MAP_HOSTS.test(u.hostname))return {bad:true};
    const dec=decodeURIComponent(s);
    m=dec.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)||dec.match(/[?&](?:q|query|ll|daddr|destination)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/)||dec.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/);
    if(m)return num(m[1],m[2]);
    return {url:"https://"+u.hostname+u.pathname+u.search};
  }
  return {q:s.slice(0,200)};
}
function locLinks(l){
  if(l.lat!=null){const c=l.lat+","+l.lng;return [["Waze","https://waze.com/ul?ll="+encodeURIComponent(c)+"&navigate=yes"],["Google Maps","https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c)]]}
  if(l.q)return [["Waze","https://waze.com/ul?q="+encodeURIComponent(l.q)+"&navigate=yes"],["Google Maps","https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(l.q)]];
  if(l.url){try{const u=new URL(l.url);if(u.protocol==="https:"&&MAP_HOSTS.test(u.hostname))return [[""+tr("פתיחת המיקום")+"",u.href]]}catch(_){}}
  return [];
}

function gpsSend(){
  if(!guardWrite())return;
  closePlus();const b=$("#plusBtn");const fail=msg=>{b.disabled=false;b.innerHTML=ic("plus",2.6);const pn=$("#locPanel");pn.hidden=false;const g=$("#gpsMsg");g.textContent=msg;g.hidden=false;const i=$("#locInput");if(i)i.focus()};
  if(!navigator.geolocation)return fail(""+tr("המכשיר הזה לא תומך בשיתוף מיקום. אפשר לשלוח כתובת במקום.")+"");
  b.disabled=true;b.innerHTML='<span style="font-size:.7rem;font-weight:700">…</span>';say(""+tr("מאתר את המיקום שלך")+"",false);
  let done=false;const guard=setTimeout(()=>{if(!done){done=true;fail(""+tr("לא הצלחנו לאתר מיקום. בדקו שהמיקום פעיל במכשיר, או שלחו כתובת.")+"")}},20000);
  try{navigator.geolocation.getCurrentPosition(pos=>{
      if(done)return;done=true;clearTimeout(guard);b.disabled=false;b.innerHTML=ic("plus",2.6);
      const l={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),acc:Math.round(pos.coords.accuracy||0),live:true};
      sendMsg(S.chat,""+tr("המיקום שלי עכשיו")+"",{loc:l});$("#locPanel").hidden=true;say(""+tr("המיקום נשלח")+"");buzz(15);
    },err=>{if(done)return;done=true;clearTimeout(guard);
      fail(err&&err.code===1?""+tr("לא התקבלה הרשאה לגשת למיקום. אפשר לאשר גישה למיקום בהגדרות הדפדפן, או לשלוח כתובת במקום.")+"":""+tr("לא הצלחנו לאתר מיקום. בדקו שהמיקום פעיל במכשיר, או שלחו כתובת.")+"")},
    {enableHighAccuracy:true,timeout:15000,maximumAge:30000})}catch(_){done=true;clearTimeout(guard);fail(""+tr("לא ניתן לגשת למיקום בדף הזה. אפשר לשלוח כתובת במקום.")+"")}
}
function sendLocation(){
  const inp=$("#locInput"),err=$("#locErr");const l=parseLoc(inp.value);
  if(!l){err.textContent=""+tr("נא לכתוב כתובת או להדביק קישור מיקום")+"";inp.focus();return}
  if(l.bad){err.textContent=""+tr("אפשר להדביק רק קישורים מ־Waze, Google Maps או Apple Maps")+"";inp.focus();return}
  if(!guardWrite())return;
  const label=l.lat!=null?""+tr("מיקום מדויק")+"":l.q?l.q:""+tr("מיקום")+"";
  sendMsg(S.chat,label,{loc:l});inp.value="";err.textContent="";
  $("#locPanel").hidden=true;$("#plusBtn").focus();say(""+tr("המיקום נשלח")+"");buzz(15);
}

async function uploadBlob(blob,type,kind){

  const mid=S.chat;say(kind==="img"?""+tr("שולח את התמונה…")+"":""+tr("שולח את ההקלטה…")+"");

}
async function compressImage(file){
  try{
    const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
    const max=1600,sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));if(b)return {blob:b,type:"image/jpeg"};
  }catch(_){}
  return ["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)?{blob:file,type:file.type}:null;
}
async function sendImage(file){
  if(!file||!guardWrite())return;
  const c=await compressImage(file);if(!c){say(""+tr("לא הצלחנו לקרוא את התמונה. נסו קובץ JPG או PNG")+"");return}
  const r=await uploadBlob(c.blob,c.type,"img");if(!r)return;
  sendMsg(r.mid,""+tr("תמונה")+"",{img:r.id});say(""+tr("התמונה נשלחה")+"");buzz(15);
}
async function sendAudio(blob,dur){
  if(!blob||!guardWrite())return;
  const t=(blob.type||"").split(";")[0];
  const type=/webm/.test(t)?"video/webm":/mp4|m4a|aac|x-m4a/.test(t)?"video/mp4":null;
  if(!type){say(""+tr("פורמט ההקלטה לא נתמך. נסו להקליט שוב מהאפליקציה")+"");return}
  const r=await uploadBlob(blob,type,"aud");if(!r)return;
  sendMsg(r.mid,""+tr("הודעה קולית")+"",{aud:r.id,dur:dur||0});say(""+tr("ההקלטה נשלחה")+"");buzz(15);
}
async function startRec(){
  closePlus();if(!guardWrite())return;
  let stream=null;
  try{if(navigator.mediaDevices&&window.MediaRecorder)stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(_){stream=null}
  if(!stream){say(""+tr("אין גישה למיקרופון בדף הזה. נפתח את מקליט המכשיר")+"",false);$("#fileAud").click();return}
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);const chunks=[];const t0=Date.now();
  S.rec={mr,stream,chunks,t0,cancel:false,timer:setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);const el=$("#recTime");if(el)el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s>=180)stopRec(false)},500)};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{const r=S.rec;S.rec=null;clearInterval(r.timer);r.stream.getTracks().forEach(t=>t.stop());$("#recBar").hidden=true;$("#chatForm").hidden=false;
    if(!r.cancel&&chunks.length)sendAudio(new Blob(chunks,{type:mr.mimeType||mime||"audio/webm"}),Math.round((Date.now()-r.t0)/1000))};
  mr.start();$("#chatForm").hidden=true;$("#recBar").hidden=false;say(""+tr("מקליט. לחצו שליחה כשסיימתם")+"",false);
}
function stopRec(cancel){if(!S.rec)return;S.rec.cancel=cancel;try{S.rec.mr.stop()}catch(_){}}

function addrFull(j,which){const a=which==="from"?j.from:j.to,r=which==="from"?j.fromRegion:j.toRegion;const c=ctry(j);return c==="IL"?a:[a,r,cname(c)].filter(Boolean).join(", ")}
function planRoute(ms){
  const pick=[],drop=[];
  for(const m of ms){const st=curStatus(m);const ci=st?STK.indexOf(st.s):-1;const j=m.job;
    if(ci<1)pick.push({m,kind:"pick",area:j.fromRegion,addr:j.from,full:addrFull(j,"from")});
    if(ci<3)drop.push({m,kind:"drop",area:j.toRegion,addr:j.to,full:addrFull(j,"to")})}
  const group=(list,first)=>{const by={};list.forEach(x=>{(by[norm(x.area)]=by[norm(x.area)]||[]).push(x)});const keys=Object.keys(by).sort((a,b)=>(b===first)-(a===first)||by[b].length-by[a].length);return keys.flatMap(k=>by[k])};
  const p=group(pick,null);const lastArea=p.length?norm(p[p.length-1].area):null;
  return p.concat(group(drop,lastArea));
}

function ledgerEntry(m){
  const j=m.job,st=curStatus(m),done=st&&st.s==="done",paid=paidSum(m),rv=recvOf(m);
  const price=j.price!=null?Number(j.price):0;const amount=price||paid||(rv&&rv.a)||0;

  const t=done?st.t:(rv&&rv.t)||j.created||0;
  return {m,j,state,amount,paid:rv&&rv.a?Math.max(paid,rv.a):paid,cur:jcur(j),t,done,doneAt:done?st.t:null,method:payMethodOf(m)};
}

function notifText(n){

function scanEvents(){
  const evs={},last={};
  for(const m of myMatches()){
    const lo=thread(m).filter(x=>x.from!==S.me).pop();if(lo){evs["msg:"+m.id]=lo.t;last[m.id]=lo}
    if(m.sender===S.me){const c=curStatus(m);if(c)evs["st:"+m.id]=c.s+"@"+c.t;const e=etaOf(m);if(e)evs["eta:"+m.id]=e.m+"@"+e.t}
    const cb=closedBy(m);if(cb&&cb!==S.me&&cb!=="job")evs["cl:"+m.id]=1;
    const other=m.courier===S.me?m.sender:m.courier;const rr=((S.ratings[other]||{}).given||{})[m.id];if(rr&&rr.to===S.me)evs["rt:"+m.id]=rr.s+"@"+rr.t;
  }
  if(!S.evs){S.evs=evs;return}
  for(const [k,v] of Object.entries(evs)){
    if(S.evs[k]===v)continue;const i=k.indexOf(":"),kind=k.slice(0,i),mid=k.slice(i+1);
    if(kind==="msg"){if(S.chat===mid&&!document.hidden)continue;addNotif({kind:"msg",mid,text:previewText(last[mid]).slice(0,120)})}
    else if(kind==="st"){addNotif({kind:"st",mid,s:String(v).split("@")[0]})}
    else if(kind==="cl"){addNotif({kind:"cl",mid})}
    else if(kind==="eta"){addNotif({kind:"eta",mid,s:+String(v).split("@")[0]})}
    else if(kind==="rt"){addNotif({kind:"rt",mid,s:+String(v).split("@")[0]})}
  }
  S.evs=evs;
}

function ratingsFor(uid){const out=[];for(const [from,d] of Object.entries(S.ratings||{})){const g=d&&d.given;if(!g)continue;for(const [mid,r] of Object.entries(g))if(r&&r.to===uid&&r.s>=1&&r.s<=5)out.push({...r,from,mid})}return out.sort((a,b)=>b.t-a.t)}
function ratingStats(uid){const r=ratingsFor(uid);if(!r.length)return {n:0,avg:0};return {n:r.length,avg:r.reduce((a,x)=>a+x.s,0)/r.length}}
function ratingScore(uid){const s=ratingStats(uid);return s.n?(s.avg*s.n+4*2)/(s.n+2):0}

const myRating=mid=>((S.ratings[S.me]||{}).given||{})[mid]||null;
function canRate(m){return !!m&&(isClosed(m)||(curStatus(m)||{}).s==="done")}

  else{const j=S.jobSel;const cur=S.swipes[S.me]||{};_amC=null;S.swipes[S.me]={...cur,couriers:{...(cur.couriers||{}),[j]:{...sSw(S.me,j),[id]:v}}};swipeCourier(j,id,v);S.lastSwipe={kind:"courier",job:j,id};

function undo(){

function fling(card,dir){
  if(!card||card.dataset.gone)return;card.dataset.gone="1";
  const st=card.querySelector(dir>0?".stamp.yes":".stamp.no");if(st)st.style.opacity=1;
  card.style.transition="transform .32s ease-in, opacity .32s";card.style.transform=`translate(${dir*680}px,-30px) rotate(${dir*24}deg)`;card.style.opacity="0";
  setTimeout(()=>decide(dir),matchMedia("(prefers-reduced-motion: reduce)").matches?0:240);

function setStamp(card,dx){const y=card.querySelector(".stamp.yes"),n=card.querySelector(".stamp.no");if(y)y.style.opacity=Math.max(0,Math.min(1,dx/90));if(n)n.style.opacity=Math.max(0,Math.min(1,-dx/90))}

      if(horiz===null&&(Math.abs(mx)>8||Math.abs(my)>8)){horiz=Math.abs(mx)>Math.abs(my);if(horiz){S.dragging=true;try{f.setPointerCapture(e.pointerId)}catch(_){}}}
      if(!horiz)return;dx=Math.max(-160,Math.min(160,mx));f.style.transform=`translateX(${dx}px)`;row.dataset.dir=dx>0?"r":"l";row.classList.toggle("armed",Math.abs(dx)>90)});

function bindDeck(){
  const card=document.querySelector(".card.top");if(!card||card.dataset.bound)return;card.dataset.bound="1";
  let sx=0,sy=0,dx=0,on=false;
  card.addEventListener("pointerdown",e=>{if(e.button>0)return;on=true;S.dragging=true;sx=e.clientX;sy=e.clientY;dx=0;card.style.transition="none";try{card.setPointerCapture(e.pointerId)}catch(_){}});
  card.addEventListener("pointermove",e=>{if(!on)return;dx=e.clientX-sx;const dy=e.clientY-sy;card.style.transform=`translate(${dx}px,${dy*.2}px) rotate(${dx/16}deg)`;setStamp(card,dx)});

    if(Math.abs(dx)>100){fling(card,dx>0?1:-1)}else{card.style.transform="";setStamp(card,0);if(S.pending){S.pending=false;render()}}};

    case "quickprofile":S.wiz.d=clone(SAMPLE[S.wiz.role]);wizFinish();break;

    case "newjob":S.chat=null;startJobWizard();render(true);$("#view").scrollTop=0;break;
    case "pickjob":S.jobSel=id;S.tab="couriers";render(true);$("#view").scrollTop=0;break;
    case "selectjob":S.jobSel=id;render(true);break;
    case "closejob":if(!guardWrite())return;setJobStatus(id,"closed");say(""+tr("המשלוח נסגר. תודה!")+"");break;
    case "reopen":if(!guardWrite())return;setJobStatus(id,"open");say(""+tr("המשלוח נפתח מחדש")+"");break;
    case "resetpass":if(!guardWrite())return;resetPasses();render(true);break;
    case "resetcpass":if(!guardWrite())return;resetCourierPasses(S.jobSel);render(true);break;
    case "openchat":S.chat=t.dataset.mid;markNotifs(S.chat);closeNotifPanel();S.wiz=null;closePopup();render(true);setTimeout(()=>{const i=$("#chatInput");if(i&&matchMedia("(pointer:fine)").matches)i.focus()},30);break;
    case "closepop":closePopup();render();break;
    case "closechat":stopRec(true);S.chat=null;S.tab="matches";render(true);break;
    case "qr":if(!guardWrite())return;sendMsg(S.chat,t.dataset.v);buzz(10);break;
    case "bigtext":{const on=!document.documentElement.classList.contains("big");document.documentElement.classList.toggle("big",on);ls.set("bigText",on);t.setAttribute("aria-checked",String(on));S.lastHtml="";break}
    case "copyphone":{const ph=$("#phoneTxt");const txt=ph?ph.textContent:"";
      const sel=()=>{const r=document.createRange();r.selectNodeContents(ph);const s=getSelection();s.removeAllRanges();s.addRange(r);say(""+tr("המספר מסומן, אפשר להעתיק")+"")};
      try{navigator.clipboard.writeText(txt).then(()=>say(""+tr("המספר הועתק")+""),sel)}catch(_){sel()}break}
    case "test":location.hash=t.dataset.r?"test"+t.dataset.r:"app";break;
    case "testreset":if(t.dataset.armed!=="1"){t.dataset.armed="1";t.textContent=""+tr("ללחוץ שוב לאישור המחיקה")+"";return}
      {const ps=["test_courier","test_sender"].concat(Object.values((S.auth||{}).accounts||{}).filter(a=>a.test).map(a=>a.persona));
       for(const pid of ps)for(const col of ["profiles","jobs","swipes","chats","handles","ratings","kyc","verify"])queue(col,()=>S.db.doc(col+"/"+pid).delete());
       ps.forEach(pid=>["courier","sender"].forEach(x=>ls.set("tour_"+pid+"_"+x,false)));
       clearTestSessions();S.acc=null;S.me=null;S.av={v:"login"};S.tab=null}
      ["courier","sender"].forEach(r=>{["courier","sender"].forEach(x=>ls.set("tour_test_"+r+"_"+x,false))});S.real={};S.wiz=null;S.chat=null;S.lastSwipe=null;S.lastHtml="";$("#testbar").dataset.h="";say(""+tr("נתוני הבדיקה נמחקו")+"");break;

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="locInput"){e.preventDefault();sendLocation()}});
document.addEventListener("submit",e=>{
  if(e.target.dataset&&e.target.dataset.auth){e.preventDefault();authSubmit(e.target);return}
  if(e.target.id==="pwForm"){e.preventDefault();changePassword(e.target);return}
  if(e.target.id!=="chatForm")return;e.preventDefault();
  const i=$("#chatInput");const t=i.value.trim();if(!t||!guardWrite())return;
  sendMsg(S.chat,t);i.value="";i.focus();
});

/* ---- accessibility: keep keyboard focus inside open dialogs, restore it on close ---- */
(function(){
  const modals=()=>[...document.querySelectorAll('[aria-modal="true"]')].filter(d=>d.offsetParent!==null||d.getClientRects().length);
  const focusables=d=>[...d.querySelectorAll('button:not(:disabled),a[href],input:not([type=hidden]):not(:disabled),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.getClientRects().length&&!x.closest("[hidden]"));
  document.addEventListener("keydown",e=>{if(e.key!=="Tab")return;const ms=modals();if(!ms.length)return;const d=ms[ms.length-1];const f=focusables(d);if(!f.length)return;
    const i=f.indexOf(document.activeElement);
    if(!d.contains(document.activeElement)){e.preventDefault();f[0].focus();return}
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}
  },true);
  let opener=null,osel="",open=false,lastOut=null;
  document.addEventListener("focusin",e=>{if(!e.target.closest('[aria-modal="true"]'))lastOut=e.target},true);
  document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button,a,[tabindex]");if(b&&!b.closest('[aria-modal="true"]'))lastOut=b},true);
  const selOf=el=>{if(!el||!el.dataset)return "";let q="";for(const k of ["act","mid","tab","id","k"])if(el.dataset[k])q+=`[data-${k}="${CSS.escape(el.dataset[k])}"]`;return el.id?"#"+CSS.escape(el.id):q};
  const lost=()=>{const a=document.activeElement;return !a||a===document.body||!a.isConnected};
  new MutationObserver(()=>{const now=modals().length>0;
    if(now&&!open){opener=lastOut;osel=selOf(opener)}
    else if(!now&&open){setTimeout(()=>{if(!lost())return;const t=opener&&opener.isConnected?opener:(osel&&document.querySelector(osel));if(t)try{t.focus()}catch(_){}},60)}
    open=now}).observe(document.body,{childList:true,subtree:true});
})();
